
# backend = "full"
# color_space = "lab"
threshold = 7
# palette = "dark16"


[image]
path = "~/Wallpapers/current"

[templates]
hyprland = { template = 'hyprland.lua.j2', target = '~/.cache/wallust/hyprland.lua' }
waybar = {template = 'colors-waybar.css.j2', target = '~/.cache/wallust/colors-waybar.css'}
kitty = {template = 'kitty.conf.j2', target = '~/.cache/wallust/kitty.conf'}
swaync = {template = 'swaync.css.j2', target = '~/.cache/wallust/swaync.css'}
hyprlock = {template = 'hyprlock.conf.j2', target = '~/.cache/wallust/hyprlock.conf'}
neopywal = {template = "neopywal.vim", target = "~/.cache/wallust/colors_neopywal.vim" }
clipse = {template = "custom_theme.json.j2", target = "~/.cache/wallust/clipse/custom_theme.json"}
libadwaita = {template = 'libadwaita.css.j2', target = '~/.cache/wallust/libadwaita.css'}  # binc/theme собирает ~/.config/gtk-4.0/libadwaita.css (обе палитры)
quickshell = {template = 'quickshell.json.j2', target = '~/.cache/wallust/quickshell.json'}
quickseek = {template = 'quickseek.json.j2', target = '~/.cache/quickseek/colors.json'}
quickdesk = {template = 'quickseek.json.j2', target = '~/.cache/quickdesk/colors.json'}  # тот же формат палитры
gtk3 = {template = 'gtk3.css.j2', target = '~/.cache/wallust/gtk3.css'}  # подключают темы Wallust-* (binc/theme)
kdeglobals = {template = 'kdeglobals.j2', target = '~/.cache/wallust/kdeglobals'}
ghostty = {template = 'ghostty.j2', target = '~/.cache/wallust/ghostty'}
