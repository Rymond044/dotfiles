# Блокировка всегда одним путём: `loginctl lock-session` → lock_cmd → ~/.config/binc/lock
# (собирает hyprlock.conf под текущие мониторы и запускает hyprlock, если он ещё не запущен).
general {
    ignore_dbus_inhibit = false
    lock_cmd = ~/.config/binc/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # 3: сон ждёт, пока hyprlock реально заблокирует сессию (не дольше InhibitDelayMaxSec logind)
    inhibit_sleep = 3
}

listener {
    timeout = 120
    on-timeout = current=$(brightnessctl g) && max=$(brightnessctl m) && val=$((current * 100 / max)) && [ $val -gt 20 ] && brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# listener {
#     timeout = 180
#     on-timeout = sleep 0.5 && ~/.config/binc/screensaver
# }

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 780
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5. Спящий режим (1200с / 20min)
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
