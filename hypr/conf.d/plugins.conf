plugin {
    hyprexpo {
        # Layout settings
        columns = 3
        gap_size = 5
        workspace_method = HDMI-A-1 first 10
        workspace_method = eDP-1 first 1
        tile_rounding = 5
        label_enable = 0
        keynav_enable = 0
    }
    split-monitor-workspaces {
        count = 9                     # Количество столов на каждом мониторе
        keep_focused = 1               # Не терять фокус при перезагрузке
        enable_persistent_workspaces = 1 # (Опционально) Не создавать столы заранее
        enable_notifications = 0       # Отключить уведомления плагина
    }
    hyprtasking {
        layout = grid
        gap_size = 10
        border_size = 3
        bg_color = 0xee111111
        full_render = false
        select_button = 273
        drag_button = 272

        exit_on_hovered = false

        gestures {
            enabled = true
            open_fingers = 3
        }

        grid {
            gaps_use_aspect_ratio = true
        }
    }
}
