--password-store=basic
--ozone-platform=wayland
# Один --enable-features на всё: повторный ключ перекрывает предыдущий целиком.
# AcceleratedVideoDecodeLinuxGL — аппаратный декод видео (VA-API); в Chromium 151 включён и так,
# здесь явно. Старые имена VaapiVideoDecodeLinuxGL/VaapiVideoDecoder/UseChromeOSDirectVideoDecoder
# больше ничего не делают. Проверка: chrome://media-internals → kVideoDecoderName = VaapiVideoDecoder.
# AcceleratedVideoEncoder — аппаратное кодирование WebRTC (звонки) на VA-API: VP9/AV1/H.264 без SVC.
# SVC (L1T3, L3T3_KEY) на Linux всё равно программный (libvpx/libaom), VP8 — тоже (у iGPU нет энкодера VP8).
# Проверка: chrome://webrtc-internals → outbound-rtp encoderImplementation = VaapiVideoEncodeAccelerator.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoEncoder,TouchpadOverscrollHistoryNavigation
--ignore-gpu-blocklist
--enable-zero-copy
