<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Если запрашивают system-ui, принудительно пихаем CaskaydiaCove в начало списка выбора -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>CaskaydiaCove Nerd Font</string>
    </edit>
  </match>

  <!-- Хак для обхода Ochre: если система выбрала Noto Sans, но в запросе БЫЛ system-ui, подменяем на Caskaydia -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <test qual="any" name="family">
      <string>Noto Sans</string>
    </test>
    <edit name="family" mode="assign">
      <string>CaskaydiaCove Nerd Font</string>
    </edit>
  </match>

</fontconfig>
