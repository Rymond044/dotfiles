# Цвета — ANSI-имена: палитра терминала (kitty из wallust), поэтому тема сама светлая/тёмная.
# red = color1 (главный акцент), green = color2, yellow = color3, magenta = color5, darkgray = color8.

[mode]
normal_main = { fg = "red", reversed = true, bold = true }
normal_alt  = { fg = "red", bg = "reset" }
select_main = { fg = "green", reversed = true, bold = true }
select_alt  = { fg = "green", bg = "reset" }
unset_main  = { fg = "yellow", reversed = true, bold = true }
unset_alt   = { fg = "yellow", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "red", bold = true }
perm_read  = { fg = "yellow" }
perm_write = { fg = "green" }
perm_exec  = { fg = "magenta" }
perm_sep   = { fg = "darkgray" }

progress_label  = { fg = "reset", bold = true }
progress_normal = { fg = "red", bg = "reset" }
progress_error  = { fg = "magenta", bg = "reset" }

[mgr]
cwd = { fg = "red", bold = true }

find_keyword  = { fg = "yellow", bold = true, italic = true, underline = true }
find_position = { fg = "green", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "red", bg = "red" }
marker_cut      = { fg = "magenta", bg = "magenta" }
marker_marked   = { fg = "green", bg = "green" }
marker_selected = { fg = "yellow", bg = "yellow" }

count_copied   = { fg = "red", reversed = true }
count_cut      = { fg = "magenta", reversed = true }
count_selected = { fg = "yellow", reversed = true }

border_symbol = "│"
border_style  = { fg = "darkgray" }

hovered = { reversed = true }

[indicator]
parent  = { fg = "green", bold = true }
current = { fg = "red", bold = true }
preview = { fg = "darkgray", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "red", reversed = true }
inactive = { fg = "reset", bg = "reset" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "red" }
title    = { fg = "red" }
value    = { fg = "reset" }
selected = { reversed = true }

[pick]
border   = { fg = "red" }
active   = { fg = "red", reversed = true }
inactive = { fg = "reset" }

[confirm]
border = { fg = "red" }
title  = { fg = "red" }
body   = { fg = "reset" }
list   = { fg = "reset" }
btn_yes = { fg = "red", reversed = true }
btn_no  = { fg = "magenta", reversed = true }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "red" }
title_warn  = { fg = "yellow" }
title_error = { fg = "magenta" }

[help]
on     = { fg = "red" }
run    = { fg = "green" }
desc   = { fg = "reset" }
hovered = { reversed = true }
footer  = { fg = "darkgray" }

[which]
cols = 3
mask = { bg = "reset" }
cand = { fg = "red" }
rest = { fg = "darkgray" }
desc = { fg = "reset" }
separator = " → "
separator_style = { fg = "darkgray" }

[tasks]
border  = { fg = "red" }
title   = { fg = "red" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "green" },
    { mime = "{audio,video}/*", fg = "green" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "magenta" },
    { mime = "application/{pdf,doc,rtf}", fg = "red" },
    { url = "*/", fg = "green", bold = true },
    { url = "*", fg = "yellow" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
