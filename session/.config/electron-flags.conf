--ozone-platform=wayland
--ozone-platform-hint=auto
# Один --enable-features на всё: повторный ключ перекрывает предыдущий целиком.
# Для VA-API оба имени: старое (Electron на Chromium < ~126) и новое.
--enable-features=WaylandWindowDecorations,AcceleratedVideoDecodeLinuxGL,VaapiVideoDecodeLinuxGL,VaapiVideoDecoder
--ignore-gpu-blocklist
--enable-zero-copy
