--password-store=basic
--ozone-platform=wayland
# Один --enable-features на всё: повторный ключ перекрывает предыдущий целиком.
# AcceleratedVideoDecodeLinuxGL — аппаратный декод видео (VA-API); в Chromium 151 включён и так,
# здесь явно. Старые имена VaapiVideoDecodeLinuxGL/VaapiVideoDecoder/UseChromeOSDirectVideoDecoder
# больше ничего не делают. Проверка: chrome://media-internals → kVideoDecoderName = VaapiVideoDecoder.
--enable-features=AcceleratedVideoDecodeLinuxGL,TouchpadOverscrollHistoryNavigation
--ignore-gpu-blocklist
--enable-zero-copy
